[project]
name = "kortexa-ai-music-gen"
version = "1.0.0"
description = "FastAPI service exposing ACE-Step music generation endpoints"
authors = [
    { name = "kortexa.ai", email = "francip@kortexa.ai" }
]
keywords = ["ace-step", "music-generation", "fastapi", "audio"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "ace-step",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "black>=26.5.1",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/kortexa-ai/music-gen.server"
Repository = "https://github.com/kortexa-ai/music-gen.server.git"

[project.scripts]
"kortexa-music-gen" = "scripts.server:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads these dependency declarations from function defaults.
"src/kortexa/music_gen/server.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["acestep.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# Only resolve for platforms that use the lockfile (Sparky/aarch64 uses manual install)
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
ace-step = { git = "https://github.com/ACE-Step/ACE-Step-1.5.git" }
# ACE-Step's exact CUDA 12.8 pins require the official PyTorch wheel index on Linux x86_64.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
